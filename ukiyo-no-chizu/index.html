<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>浮世ノ地図</title>
  <meta name="description" content="浮世ノ地図 ― 日本や世界の地図をはめると名画になるジグソーパズル。国旗ガチャで世界の国も集められます。">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="浮世ノ地図">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/gacha.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <!-- ===== タイトル(名画を全面に) ===== -->
  <section id="title" class="screen title-screen">
    <div class="title-art"><img id="title-img" alt=""></div>
    <div class="title-shade"></div>
    <div class="title-top">
      <span class="koban-badge" aria-live="polite"><span class="koban"></span><span class="koban-count">0</span><small>枚</small></span>
    </div>
    <div class="slipv" aria-label="浮世ノ地図"><span class="slip-t">浮世ノ地図</span><span class="slip-seal" aria-hidden="true">浮</span></div>
    <div class="title-bottom">
      <p class="title-sub">世界をはめると、名画になる。</p>
      <button id="btn-go" class="btn btn-primary btn-go" type="button">はじめる</button>
      <button id="daily-line" class="daily-line" type="button"></button>
      <p id="title-credit" class="title-credit"></p>
    </div>
    <nav class="tabbar" aria-label="メニュー">
      <button id="nav-gacha" class="tab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg><span>ガチャ</span><i class="tab-dot" hidden></i></button>
      <button id="nav-zukan" class="tab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7a3 3 0 013 3v13a2 2 0 00-2-2H4zM20 4h-5a3 3 0 00-3 3"/><path d="M20 4v14h-6"/></svg><span>図鑑</span><i class="tab-dot" hidden></i></button>
      <button id="nav-shop" class="tab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.5 11h-13zM8 9V6a4 4 0 018 0v3"/></svg><span>お店</span><i class="tab-dot" hidden></i></button>
      <button id="nav-badges" class="tab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14l-2 7 5.5-3 5.5 3-2-7"/></svg><span>称号</span><i class="tab-dot" hidden></i></button>
      <button id="nav-settings" class="tab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>設定</span><i class="tab-dot" hidden></i></button>
    </nav>
  </section>

  <!-- ===== 地図えらび(地球儀) ===== -->
  <section id="menu" class="screen picker" hidden>
    <header class="pick-top">
      <button id="btn-title" class="icon-btn" type="button" aria-label="タイトルへ戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <span class="pick-logo">浮世ノ地図</span>
      <span class="koban-badge small"><span class="koban"></span><span class="koban-count">0</span><small>枚</small></span>
    </header>
    <div class="globe-wrap"><canvas id="pick-globe" aria-label="地球儀。左右にスワイプして大陸をえらぶ"></canvas></div>
    <div class="globe-nav">
      <button id="map-prev" class="arw" type="button" aria-label="前の地図"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
      <div class="gn-name"><b id="map-name"></b><small id="map-sub"></small></div>
      <button id="map-next" class="arw" type="button" aria-label="次の地図"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
    </div>
    <div id="map-dots" class="dots"></div>
    <div id="pick-body" class="pick-body">
      <div id="stage-list" class="stage-list" role="radiogroup" aria-label="範囲"></div>
      <div id="diff-seg" class="diff-seg" role="radiogroup" aria-label="難易度"></div>
      <p id="diff-desc" class="diff-desc"></p>
      <button id="art-pick" class="art-pick" type="button" aria-haspopup="dialog">
        <span class="ap-pic"></span>
        <span class="ap-text"><span class="ap-t"></span><span class="ap-a"></span></span>
        <span class="ap-change">変更<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></span>
      </button>
    </div>
    <div class="start-row">
      <button id="btn-start" class="btn btn-primary" type="button">はじめる</button>
    </div>
  </section>

  <!-- ===== ゲーム ===== -->
  <section id="game" class="screen" hidden>
    <header class="hud">
      <button id="btn-back" class="icon-btn" aria-label="メニューへ戻る" title="メニューへ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <div class="hud-info">
        <span id="hud-diff" class="badge"></span>
        <span id="hud-art" class="hud-art"></span>
      </div>
      <div class="hud-stats">
        <span class="stat"><b id="hud-count">0</b>/<span id="hud-total">47</span></span>
        <span class="stat"><span id="hud-time">0:00</span> <span id="hud-target" class="hud-target"></span></span>
      </div>
      <div class="hud-actions">
        <button id="btn-hint" class="btn btn-small" title="次にはめる場所を光らせる（+20秒）">ヒント</button>
        <button id="btn-art" class="btn btn-small" aria-pressed="true" title="まわりの絵柄を表示／非表示（Eキー）">絵</button>
        <button id="btn-guide" class="btn btn-small" aria-pressed="false" title="形のガイドを表示／非表示（Gキー）">形</button>
        <button id="btn-sample" class="btn btn-small" title="完成見本を見る">見本</button>
        <button id="btn-sound" class="icon-btn" aria-label="効果音" title="効果音">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11" /><path class="mute" d="M16 9l5 6M21 9l-5 6" /></svg>
        </button>
      </div>
    </header>

    <main class="play">
      <div id="board-wrap">
        <svg id="board" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="seigaiha" width="40" height="20" patternUnits="userSpaceOnUse">
              <g fill="none" stroke="currentColor" stroke-width="0.8">
                <circle cx="20" cy="20" r="18" /><circle cx="20" cy="20" r="13" /><circle cx="20" cy="20" r="8" />
                <circle cx="0" cy="10" r="18" /><circle cx="0" cy="10" r="13" /><circle cx="0" cy="10" r="8" />
                <circle cx="40" cy="10" r="18" /><circle cx="40" cy="10" r="13" /><circle cx="40" cy="10" r="8" />
              </g>
            </pattern>
            <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2a2420" flood-opacity="0.45" />
            </filter>
            <g id="clips"></g>
          </defs>
          <g id="camera">
            <rect id="sea" class="sea" />
            <rect id="sea-pattern" class="sea-pattern" fill="url(#seigaiha)" />
            <image id="surround" preserveAspectRatio="xMidYMid slice" />
            <g id="context"></g>
            <g id="outline"></g>
            <g id="guide"></g>
            <g id="placed"></g>
            <g id="hint-layer"></g>
            <g id="cartouche" class="cartouche"></g>
            <rect id="frame" class="frame" />
            <g id="loose"></g>
          </g>
        </svg>
        <div class="zoom-ctl">
          <button id="zoom-in" class="icon-btn" aria-label="拡大">＋</button>
          <button id="zoom-out" class="icon-btn" aria-label="縮小">－</button>
          <button id="zoom-fit" class="icon-btn" aria-label="全体表示" title="全体表示">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          </button>
        </div>
        <div id="toast" class="toast" aria-live="polite"></div>
      </div>
      <aside id="tray" aria-label="ピース置き場">
        <div class="tray-head">のこり <b id="tray-left">47</b></div>
        <div id="tray-list"></div>
      </aside>
    </main>
  </section>

  <!-- ===== ダイアログ ===== -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h3 id="sheet-title"></h3>
        <button id="sheet-close" class="icon-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="loading" class="loading" hidden>
    <div class="loading-card"><div class="spinner"></div><p id="loading-text">絵を摺っています…</p></div>
  </div>

  <script src="js/version.js"></script>
  <script src="js/prefectures.js"></script>
  <script src="js/arts.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/world-arts.js"></script>
  <script src="js/maps/index.js"></script>
  <script src="js/maps/countries.js"></script>
  <script src="js/maps/globe.js"></script>
  <script src="js/globe.js"></script>
  <script src="js/country-facts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
